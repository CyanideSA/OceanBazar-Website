<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wave-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine-d" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cart-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="url(#wave-d)" stroke-width="2"/>
  <!-- Wave shape -->
  <path d="M12 36 C16 28, 24 24, 28 30 C32 36, 36 26, 44 30 C48 32, 50 36, 52 34" fill="none" stroke="url(#wave-d)" stroke-width="4" stroke-linecap="round"/>
  <path d="M14 42 C18 36, 26 32, 30 37 C34 42, 38 34, 46 38 C48 39, 50 42, 52 40" fill="none" stroke="url(#wave-d)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <!-- Cart base -->
  <path d="M18 46 L22 46 L24 50 L44 50 L46 46 L50 46" fill="none" stroke="url(#cart-d)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wheels -->
  <circle cx="28" cy="54" r="2.5" fill="url(#cart-d)"/>
  <circle cx="40" cy="54" r="2.5" fill="url(#cart-d)"/>
  <!-- Sun -->
  <circle cx="42" cy="18" r="6" fill="#f59e0b" opacity="0.9"/>
  <circle cx="42" cy="18" r="4" fill="#fbbf24"/>
  <!-- Glossy overlay -->
  <circle cx="32" cy="32" r="29" fill="url(#shine-d)" opacity="0.2"/>
</svg>
