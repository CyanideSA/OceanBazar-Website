services:
  - type: web
    name: oceanbazar-storefront
    env: node
    repo: https://github.com/CyanideSA/OCEANBAZAR-Frontend
    plan: free
    autoDeploy: true
    healthCheckPath: /
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://<bff-service>.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://<java-service>.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://<storefront-service>.onrender.com
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: <FIREBASE_API_KEY>
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: <FIREBASE_AUTH_DOMAIN>
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: <FIREBASE_PROJECT_ID>
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: <FIREBASE_APP_ID>
      - key: NEXT_PUBLIC_META_PIXEL_ID
        value: <META_PIXEL_ID>
      - key: MAINTENANCE_MODE
        value: "true"
      - key: MAINTENANCE_BYPASS_TOKEN
        sync: false
      - key: MAINTENANCE_RETRY_AFTER
        value: "3600"
      - key: MAINTENANCE_COOKIE_DOMAIN
        value: .oceanbazar.com.bd

  - type: web
    name: oceanbazar-java-api
    env: docker
    repo: https://github.com/CyanideSA/OCEANBAZAR-Backend
    rootDir: backend-java
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: JAVA_DATABASE_URL
        value: jdbc:postgresql://ep-small-sunset-aom3ownz.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        value: jdbc:postgresql://ep-small-sunset-aom3ownz.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        value: <NEON_PASSWORD>
      - key: JWT_SECRET_KEY
        value: change_me_java_jwt_secret_min_32_chars
      - key: PUBLIC_BASE_URL
        value: https://<java-service>.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: CACHE_TYPE
        value: simple
      - key: CORS_ALLOWED_ORIGINS
        value: https://oceanbazarstorefront.vercel.app,https://oceanbazar-frontend-admin.vercel.app
      - key: WEBSOCKET_ALLOWED_ORIGINS
        value: https://oceanbazarstorefront.vercel.app,https://oceanbazar-frontend-admin.vercel.app
      - key: WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
        value: https://*.vercel.app,https://*.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        value: <CLOUDINARY_CLOUD_NAME>
      - key: CLOUDINARY_API_KEY
        value: <CLOUDINARY_API_KEY>
      - key: CLOUDINARY_API_SECRET
        value: <CLOUDINARY_API_SECRET>
      - key: MAINTENANCE_MODE
        value: "true"
      - key: MAINTENANCE_BYPASS_TOKEN
        sync: false
      - key: MAINTENANCE_RETRY_AFTER
        value: "3600"

  - type: web
    name: oceanbazar-bff
    env: node
    repo: https://github.com/CyanideSA/OCEANBAZAR-Backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npx prisma migrate resolve --rolled-back "20260410203000_admin_studio" 2>/dev/null; npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://oceanbazarstorefront.vercel.app
      - key: ADMIN_URL
        value: https://oceanbazar-frontend-admin.vercel.app
      - key: JAVA_API_URL
        value: https://<java-service>.onrender.com
      - key: DATABASE_URL
        value: postgresql://neondb_owner:<NEON_PASSWORD>@ep-small-sunset-aom3ownz-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DIRECT_URL
        value: postgresql://neondb_owner:<NEON_PASSWORD>@ep-small-sunset-aom3ownz.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: JWT_ACCESS_SECRET
        value: change_me_bff_access_secret_min_32_chars
      - key: JWT_REFRESH_SECRET
        value: change_me_bff_refresh_secret_min_32_chars
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: OTP_EXPIRE_MINUTES
        value: 10
      - key: OTP_TERMINAL_ONLY
        value: false
      - key: CART_ABANDONMENT_CRON
        value: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: PUBLIC_BASE_URL
        value: https://<bff-service>.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        value: <CLOUDINARY_CLOUD_NAME>
      - key: CLOUDINARY_API_KEY
        value: <CLOUDINARY_API_KEY>
      - key: CLOUDINARY_API_SECRET
        value: <CLOUDINARY_API_SECRET>
      - key: FIREBASE_API_KEY
        value: <FIREBASE_API_KEY>
      - key: FIREBASE_PROJECT_ID
        value: <FIREBASE_PROJECT_ID>
      - key: RECAPTCHA_SITE_KEY
        value: <RECAPTCHA_SITE_KEY>
      - key: RECAPTCHA_PROJECT_ID
        value: <RECAPTCHA_PROJECT_ID>
      - key: SMTP_HOST
        value: <SMTP_HOST_OR_EMPTY>
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: <SMTP_USER_OR_EMPTY>
      - key: SMTP_PASS
        value: <SMTP_PASS_OR_EMPTY>
      - key: EMAIL_FROM
        value: OceanBazar System <no-reply@oceanbazar.com.bd>
      - key: API_BASE_URL
        value: https://<bff-service>.onrender.com
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_SENDER_ADDRESSES
        sync: false
      - key: MS_DEFAULT_SENDER
        value: no-reply@oceanbazar.com.bd
      - key: MS_SUPPORT_SENDER
        value: contact@oceanbazar.com.bd
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: SSLCOMMERZ_SANDBOX
        value: "false"
      - key: PATHAO_ENV
        value: production
      - key: PATHAO_BASE_URL
        value: https://api-hermes.pathao.com
      - key: PATHAO_CLIENT_ID
        sync: false
      - key: PATHAO_CLIENT_SECRET
        sync: false
      - key: PATHAO_USERNAME
        sync: false
      - key: PATHAO_PASSWORD
        sync: false
      - key: PATHAO_STORE_ID
        sync: false
      - key: STEADFAST_API_KEY
        sync: false
      - key: STEADFAST_SECRET_KEY
        sync: false
      - key: STEADFAST_WEBHOOK_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_OAUTH_REDIRECT_URI
        value: https://<bff-service>.onrender.com/api/admin/meta/oauth/callback
      - key: META_OAUTH_ALLOWED_HOSTS
        value: <bff-service>.onrender.com,api.oceanbazar.com.bd
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: MAINTENANCE_MODE
        value: "true"
      - key: MAINTENANCE_BYPASS_TOKEN
        sync: false
      - key: MAINTENANCE_RETRY_AFTER
        value: "3600"
      - key: MAINTENANCE_ALLOW_HEALTH_PROBE
        value: "true"

  - type: web
    env: static
    name: oceanbazar-admin-crm
    repo: https://github.com/CyanideSA/OCEANBAZAR-Frontend-Admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_ADMIN_API_URL
        value: https://<bff-service>.onrender.com
      - key: VITE_WS_URL
        value: https://<java-service>.onrender.com
      - key: VITE_MAINTENANCE_MODE
        value: "true"
      - key: VITE_MAINTENANCE_BYPASS_TOKEN
        sync: false
      - key: VITE_MAINTENANCE_COOKIE_DOMAIN
        value: .oceanbazar.com.bd
      - key: VITE_MAINTENANCE_PAGE_URL
        value: https://oceanbazar.com.bd/en/maintenance
