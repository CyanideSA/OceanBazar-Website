# Ocean Bazar — Multi-service Architecture
#
# Architecture:
#   Nginx (:80/:443) → reverse-proxies everything
#   Next.js Storefront (:3000) → Node.js BFF (:4000) → Spring Boot Core API (:8000) → PostgreSQL + Redis
#   Vite Admin CRM (:5173) → Node.js BFF (:4000) → Spring Boot Core API (:8000)
#
# Usage:
#   Development:  docker compose up postgres redis java_api api
#   Full stack:   docker compose --profile full up -d
#   Production:   docker compose --profile full --profile production up -d
#
# Host port 5433 avoids conflict with a local PostgreSQL install on Windows/macOS.
services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oceanbazar_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oceanbazar}
      POSTGRES_USER: ${POSTGRES_USER:-oceanbazar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oceanbazar']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis (cache + realtime pub/sub) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oceanbazar_redis
    ports:
      - '${REDIS_HOST_PORT:-6399}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Spring Boot Core API (products, admin, catalog, websocket) ─────────────
  java_api:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: oceanbazar_java_api
    ports:
      - '8000:8000'
    environment:
      SERVER_PORT: 8000
      DATABASE_URL: jdbc:postgresql://postgres:5432/oceanbazar
      DB_USER: ${POSTGRES_USER:-oceanbazar}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oceanbazar
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oceanbazar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-oceanbazar-secret-key-change-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4000}
      PUBLIC_BASE_URL: ${JAVA_PUBLIC_BASE_URL:-http://localhost:8000}
      UPLOAD_DIR: /app/uploads
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dmtafp1fi}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-487252925521551}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-_rHB9A85bxjgZqzcNZb0ja9vBk8}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - java_uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000/actuator/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Node.js BFF (search, cache, realtime, auth, proxy) ────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oceanbazar_bff
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-oceanbazar}:${POSTGRES_PASSWORD:-secret}@postgres:5432/oceanbazar
      REDIS_URL: redis://redis:6379
      JAVA_API_URL: http://java_api:8000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-oceanbazar_dev_access_secret_change_in_production_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-oceanbazar_dev_refresh_secret_change_in_production_32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-oceanbazar-secret-key-change-in-production}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      OTP_TERMINAL_ONLY: ${OTP_TERMINAL_ONLY:-true}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: ${BFF_PUBLIC_BASE_URL:-http://localhost:4000}
      # Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-"Oceanbazar <noreply@oceanbazar.com>"}
      # Firebase
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dmtafp1fi}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-487252925521551}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-_rHB9A85bxjgZqzcNZb0ja9vBk8}
      # Courier
      PATHAO_BASE_URL: ${PATHAO_BASE_URL:-https://courier-api-sandbox.pathao.com}
      PATHAO_CLIENT_ID: ${PATHAO_CLIENT_ID:-}
      PATHAO_CLIENT_SECRET: ${PATHAO_CLIENT_SECRET:-}
      PATHAO_USERNAME: ${PATHAO_USERNAME:-}
      PATHAO_PASSWORD: ${PATHAO_PASSWORD:-}
      STEADFAST_BASE_URL: ${STEADFAST_BASE_URL:-https://portal.packzy.com/api/v1}
      STEADFAST_API_KEY: ${STEADFAST_API_KEY:-}
      STEADFAST_SECRET_KEY: ${STEADFAST_SECRET_KEY:-}
      PAPERFLY_USERNAME: ${PAPERFLY_USERNAME:-}
      PAPERFLY_PASSWORD: ${PAPERFLY_PASSWORD:-}
      PAPERFLY_KEY: ${PAPERFLY_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      java_api:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Next.js Storefront ─────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    container_name: oceanbazar_web
    ports:
      - '3000:3000'
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - api
    profiles:
      - full
    restart: unless-stopped

  # ─── Vite Admin CRM ────────────────────────────────────────────────────────
  admin:
    build:
      context: ./admin-frontend-react
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-http://localhost:4000}
    container_name: oceanbazar_admin
    ports:
      - '5173:5173'
    depends_on:
      - api
    profiles:
      - full
    restart: unless-stopped

  # ─── Nginx Reverse Proxy (production) ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: oceanbazar_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - admin
      - api
    profiles:
      - production
    restart: unless-stopped

  # ─── pgAdmin (optional dev tool) ───────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: oceanbazar_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@oceanbazar.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  java_uploads_data:
