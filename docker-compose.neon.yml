# Use with: docker compose -f docker-compose.yml -f docker-compose.neon.yml
# Requires DATABASE_URL, DIRECT_URL, JAVA_DATABASE_URL, ML_DATABASE_URL, DB_USER, DB_PASSWORD in .env
services:
  api:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}

  java_api:
    environment:
      DATABASE_URL: ${JAVA_DATABASE_URL}
      SPRING_DATASOURCE_URL: ${JAVA_DATABASE_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

  ml_service:
    environment:
      DATABASE_URL: ${ML_DATABASE_URL}
