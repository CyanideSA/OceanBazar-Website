# Playwright E2E — Postgres + Node BFF + Next + Vite admin.
# Optional: Spring Boot on :8000 when repo variable CI_RUN_JAVA=true (Repository settings → Variables).
# Optional: workflow_dispatch → "Skip full product wizard" if Cloudinary/Java catalog is unavailable.
# BFF proxies /api/admin/* to Java when JAVA_API_URL is reachable.

name: Playwright E2E

on:
  workflow_dispatch:
    inputs:
      skip_full_wizard:
        description: Skip Cloudinary-heavy full publish wizard (set if core API/media unavailable)
        type: boolean
        default: false
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'admin-frontend-react/**'
      - 'backend-java/**'
      - '.github/workflows/playwright-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oceanbazar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oceanbazar
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/oceanbazar
      JWT_ACCESS_SECRET: playwright_ci_jwt_access_secret_32bytes__
      JWT_SECRET_KEY: playwright_ci_jwt_refresh_secret_32bytes__
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_ADMIN_URL: http://127.0.0.1:5173
      CI: true
      E2E_SKIP_FULL_WIZARD: '0'
      JAVA_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Optional — skip wizard (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_full_wizard
        run: echo "E2E_SKIP_FULL_WIZARD=1" >> "$GITHUB_ENV"

      - name: Setup Java (when CI_RUN_JAVA repo variable is true)
        if: vars.CI_RUN_JAVA == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-java/pom.xml

      - name: Start Spring Boot API (CI_RUN_JAVA)
        if: vars.CI_RUN_JAVA == 'true'
        working-directory: backend-java
        env:
          SPRING_PROFILES_ACTIVE: dockerless
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/oceanbazar
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET_KEY: ${{ env.JWT_SECRET_KEY }}
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
        run: |
          mvn -q -DskipTests spring-boot:run &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/api/health; then
              echo "Java API up."
              exit 0
            fi
            sleep 3
          done
          echo "Java API failed to start."
          exit 1

      - name: Backend — install, provision DB & seed
        working-directory: backend
        run: |
          npm ci
          # The Prisma migration history is interleaved with Java/Flyway-owned
          # catalog tables and cannot run standalone on an empty DB; the schema is
          # a complete superset, so push it directly (matches .cursor/install.sh).
          echo "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS btree_gin;" | npx prisma db execute --url "$DATABASE_URL" --stdin
          npx prisma db push --accept-data-loss
          npx prisma db execute --url "$DATABASE_URL" --file prisma/dev-fix-updated-at-defaults.sql
          npm run db:seed

      - name: Frontend — install
        working-directory: frontend
        # Storefront requires legacy peer resolution (see README); its lockfile is
        # generated with --legacy-peer-deps, so npm ci must use it too.
        run: npm ci --legacy-peer-deps

      - name: Admin — install
        working-directory: admin-frontend-react
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium webkit --with-deps

      - name: Start BFF
        working-directory: backend
        env:
          JAVA_API_URL: http://127.0.0.1:8000
        run: |
          npm run dev &
          sleep 3

      - name: Start storefront
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 -p 3000 &
          sleep 5

      - name: Start admin CRM
        working-directory: admin-frontend-react
        env:
          VITE_ADMIN_API_URL: http://127.0.0.1:4000
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          sleep 3

      - name: Wait for servers
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4000/api/health \
              && curl -sf http://127.0.0.1:3000/robots.txt \
              && curl -sf http://127.0.0.1:5173/; then
              echo "Core servers up."
              if [ "${{ vars.CI_RUN_JAVA }}" = "true" ]; then
                curl -sf http://127.0.0.1:8000/api/health || { echo "Expected Java up when CI_RUN_JAVA=true"; exit 1; }
              fi
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for servers."
          exit 1

      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium --project=mobile-safari --project=admin --max-failures=5

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
