# Lint + import/compile checks for the Python FastAPI ML service.
name: ML service CI (Python)

on:
  push:
    branches: [main]
    paths:
      - "ml-service/**"
      - ".github/workflows/ml-service-ci.yml"
  pull_request:
    paths:
      - "ml-service/**"
      - ".github/workflows/ml-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check app

      - name: Byte-compile (syntax check)
        run: python -m compileall -q app

      - name: Import smoke test
        env:
          DATABASE_URL: postgresql://localhost/placeholder
          ML_SERVICE_API_KEY: ci-test-key
        run: python -c "import app.main; print('ml-service imports OK')"
