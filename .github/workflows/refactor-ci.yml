# Phase 9 — CI for refactor v2: build + smoke + optional E2E
name: Refactor v2 CI

on:
  push:
    branches: [main, refactor/oceanbazar-v2]
  pull_request:
    branches: [main, refactor/oceanbazar-v2]
  workflow_dispatch:

jobs:
  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:migrations
      - name: Verify Prisma ↔ Flyway schema
        working-directory: ..
        run: node scripts/ops/verify-schema-prisma-flyway.mjs

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -q -DskipTests package

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
        run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-frontend-react/package-lock.json
      - run: npm ci
      - env:
          VITE_ADMIN_API_URL: http://127.0.0.1:4000
        run: npm run build
