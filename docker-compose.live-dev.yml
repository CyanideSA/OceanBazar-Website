# Live storefront + admin in Docker (bind-mount repo → edits visible without rebuilding images).
#
# Use (repo root):
#   npm run docker:live
#   npm run docker:live:build     # rebuild dev base images only
#
# Backend stays unchanged vs docker-compose.yml (bff/java/postgres/redis are still baked images).
# Named volumes hold node_modules / .next so host mounts do not wipe dependencies.

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: oceanbazarwebsite-web-dev
    volumes:
      - ./frontend:/app
      - web_dev_node_modules:/app/node_modules
      - web_dev_next:/app/.next
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 240s

  admin:
    build:
      context: ./admin-frontend-react
      dockerfile: Dockerfile.dev
    image: oceanbazarwebsite-admin-dev
    volumes:
      - ./admin-frontend-react:/app
      - admin_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      # Vite dev-server proxies (/ws, /api/admin) — targets must be other Compose services, not 127.0.0.1
      ADMIN_DEV_PROXY_WS: http://java_api:8000
      ADMIN_DEV_PROXY_API: http://api:4000
      VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-http://localhost:4000}
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:5173/ || exit 1']
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s

volumes:
  web_dev_node_modules:
  web_dev_next:
  admin_dev_node_modules:
