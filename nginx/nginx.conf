worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Low-end UAs → Lite storefront (unless ob_view=full cookie).
    # Keep in sync with frontend/lib/storefrontCapability.ts + app/layout.tsx LITE_DEVICE_HINT.
    # Android ≤12 covers Pixel 4 + common BD low-RAM phones.
    map $http_user_agent $ob_old_ua {
        default 0;
        "~*iPhone OS 1[0-5]_" 1;
        "~*iPad; CPU OS 1[0-5]_" 1;
        "~*Android [4-9]\\." 1;
        "~*Android 1[0-2];" 1;
        "~*Android 1[0-2]\\)" 1;
    }
    map $cookie_ob_view $ob_prefer_full {
        default 0;
        full 1;
    }

    # Docker embedded DNS — used with variable proxy_pass so upstream IPs refresh
    # after container recreate (static upstream{} caches IPs at nginx start → 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream storefront {
        server web:3000;
    }
    upstream storefront_lite {
        server web_lite:3001;
    }
    # Keep named upstream as fallback; admin location uses dynamic DNS below.
    upstream admin_crm {
        server admin:5173;
    }
    upstream bff_api {
        server api:4000;
    }
    upstream java_api {
        server java_api:8000;
    }

    # ─── HTTP: ACME + redirect to HTTPS ───────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name oceanbazar.com.bd www.oceanbazar.com.bd oceanbazar.com www.oceanbazar.com
                    admin.oceanbazar.com.bd admin.oceanbazar.com
                    api.oceanbazar.com.bd api.oceanbazar.com
                    contentid.oceanbazar.com.bd contentid.oceanbazar.com
                    lite.oceanbazar.com.bd lite.oceanbazar.com
                    _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── www → apex (one origin / one HTTP cache for storefront) ──────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name www.oceanbazar.com.bd;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            return 301 https://oceanbazar.com.bd$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.oceanbazar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            return 301 https://oceanbazar.com$request_uri;
        }
    }

    # ─── Storefront HTTPS ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name oceanbazar.com.bd oceanbazar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;

        location ~ ^/api/(payments|delivery|couriers|admin/delivery|admin/fulfillment|webhooks)(/|$) {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = / {
            return 307 /bn;
        }

        location = /error {
            return 302 /en/something-went-wrong;
        }

        location = /maintenance {
            return 302 /en/maintenance;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io/ {
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /ws/ {
            proxy_pass http://java_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Lite storefront (near-zero JS) on apex path — works without lite.* DNS/TLS
        location = /lite {
            return 302 /lite/bn;
        }
        location /lite/ {
            proxy_pass http://storefront_lite/lite/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            # Auto-send old devices to Lite unless they chose Full site.
            set $ob_goto_lite 0;
            if ($ob_old_ua = 1) { set $ob_goto_lite 1; }
            if ($ob_prefer_full = 1) { set $ob_goto_lite 0; }
            if ($ob_goto_lite = 1) {
                return 302 https://$host/lite$request_uri;
            }

            proxy_pass http://storefront;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ─── Lite subdomain → apex /lite path (until DNS/TLS for lite.* is ready) ─
    server {
        listen 443 ssl;
        http2 on;
        server_name lite.oceanbazar.com.bd lite.oceanbazar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            return 302 https://oceanbazar.com.bd/lite$request_uri;
        }
    }

    # ─── Admin CRM HTTPS ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.oceanbazar.com.bd admin.oceanbazar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location ~ ^/api/(payments|delivery|couriers|admin/delivery|admin/fulfillment|webhooks)(/|$) {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        location /socket.io/ {
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /ws/ {
            proxy_pass http://java_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location / {
            # Dynamic DNS — prevents 502 after admin container recreate
            set $admin_upstream http://admin:5173;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ─── BFF API HTTPS ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api.oceanbazar.com.bd api.oceanbazar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location ~ ^/api/(payments|delivery|couriers|admin/delivery|admin/fulfillment|webhooks)(/|$) {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io/ {
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /ws/ {
            proxy_pass http://java_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
    }

    # ─── Content-ID SPA HTTPS ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name contentid.oceanbazar.com.bd contentid.oceanbazar.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root /var/www/contentid;
        index index.html;

        location ~ ^/api/(payments|delivery|couriers|admin/delivery|admin/fulfillment|webhooks)(/|$) {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://bff_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
