<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="admin-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="admin-wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="admin-shine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#admin-bg)" stroke="url(#admin-wave)" stroke-width="1.5"/>
  <!-- Wave -->
  <path d="M10 36 C14 28, 22 24, 26 30 C30 36, 34 26, 42 30 C46 32, 48 36, 54 34" fill="none" stroke="url(#admin-wave)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Gear/cog accent (admin indicator) -->
  <circle cx="46" cy="16" r="7" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="46" cy="16" r="3" fill="#94a3b8"/>
  <line x1="46" y1="8" x2="46" y2="10" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="22" x2="46" y2="24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="16" x2="40" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="16" x2="54" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- OB text -->
  <text x="32" y="52" font-family="Arial,sans-serif" font-weight="700" font-size="14" fill="#e2e8f0" text-anchor="middle">OB</text>
  <!-- Glossy -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#admin-shine)"/>
</svg>
