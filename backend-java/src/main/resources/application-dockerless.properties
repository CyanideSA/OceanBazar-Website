# Local profile: no Redis cache; use when Redis is down add spring.autoconfigure.exclude for RedisAutoConfiguration.
# Start with:  --spring.profiles.active=dockerless
spring.cache.type=none
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6399
# Prisma owns DDL locally; skip Hibernate validate (char(8) vs varchar mismatches).
spring.jpa.hibernate.ddl-auto=none
