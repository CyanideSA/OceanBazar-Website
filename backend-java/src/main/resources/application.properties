server.port=${SERVER_PORT:8000}
# AWS ALB / CloudFront: honor X-Forwarded-* for redirects and absolute URLs (set NONE if it breaks a local setup).
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# ─── PostgreSQL (same DB as Prisma / Node.js BFF) ─────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/oceanbazar}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:oceanbazar}}
# Default matches docker-compose Postgres (POSTGRES_PASSWORD). Set DB_PASSWORD or SPRING_DATASOURCE_PASSWORD in production.
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:secret}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Prisma owns shared DDL; Hibernate must match live DB (also set in application.yml)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ─── Redis (cache + pub/sub for realtime) ──────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6399}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=${CACHE_TYPE:redis}

# ─── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET_KEY:}
jwt.access-secret=${JWT_ACCESS_SECRET:}

# ─── App Settings ──────────────────────────────────────────────────────────────
app.seed=${APP_SEED:true}
app.balance-featured-sales-half=false
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8000}
app.upload-dir=${UPLOAD_DIR:uploads}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4000,http://127.0.0.1:4000}

# ─── Admin / Inventory ────────────────────────────────────────────────────────
oceanbazar.admin.low-stock-threshold=10
security.rate-limit.login.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:20}
security.rate-limit.login.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

# ─── File Uploads ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Cloudinary ───────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dmtafp1fi}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ─── Payment provider placeholders ────────────────────────────────────────────
bkash.api-key=${BKASH_API_KEY:}
bkash.app-secret=${BKASH_APP_SECRET:}
nagad.api-key=${NAGAD_API_KEY:}
nagad.app-secret=${NAGAD_API_KEY:}
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}

# ─── WebSocket / Realtime ───────────────────────────────────────────────────────
# STOMP permanently disabled — realtime is Redis ob:realtime → Node BFF Socket.IO only
oceanbazar.websocket.stomp.enabled=false
oceanbazar.websocket.allow-all-origins=${WEBSOCKET_ALLOW_ALL_ORIGINS:false}
oceanbazar.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
oceanbazar.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost:4000,http://127.0.0.1:4000}
oceanbazar.websocket.stomp.max-connect-per-minute-per-token=${STOMP_MAX_CONNECT_PER_MIN:25}
oceanbazar.websocket.stomp.max-subscribe-per-minute-per-session=${STOMP_MAX_SUBSCRIBE_PER_MIN:60}
oceanbazar.websocket.stomp.max-send-per-minute-per-session=${STOMP_MAX_SEND_PER_MIN:180}

# ─── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=oceanbazar-backend

# ─── Sentry (errors + tracing to Sentry) ─────────────────────────────────────
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}

# ─── OpenTelemetry / OTLP (Micrometer Tracing) ────────────────────────────────
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}

# ─── Hibernate diagnostics (N+1 / query volume) ───────────────────────────────
# Set HIBERNATE_GENERATE_STATISTICS=true to log entity load / query counts per session (staging only).
spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_GENERATE_STATISTICS:false}
logging.level.org.hibernate.stat=${HIBERNATE_STAT_LOG:WARN}

# ─── Inventory / Seller ───────────────────────────────────────────────────────
oceanbazar.inventory.reservation-ttl-minutes=${INVENTORY_RESERVATION_TTL:30}
oceanbazar.inventory.low-stock-threshold=${INVENTORY_LOW_STOCK_THRESHOLD:10}
oceanbazar.seller.default-commission-rate=${SELLER_DEFAULT_COMMISSION:5.0}
oceanbazar.seller.auto-approve=${SELLER_AUTO_APPROVE:false}

spring.task.scheduling.pool.size=4
