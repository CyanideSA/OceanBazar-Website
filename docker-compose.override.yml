# Local dev overrides — do not use in production ECS deploys.
services:
  api:
    volumes:
      - ./backend/dist:/app/dist:ro
      - ./backend/node_modules:/app/node_modules:ro
    environment:
      MAINTENANCE_MODE: "false"
  java_api:
    environment:
      MAINTENANCE_MODE: "false"
  web:
    volumes:
      - ./frontend/public:/app/public:ro
    environment:
      MAINTENANCE_MODE: "false"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  admin:
    build:
      args:
        VITE_ADMIN_API_URL: ""
        VITE_ADMIN_API_SAME_ORIGIN: "true"
    environment:
      VITE_MAINTENANCE_MODE: "false"
      ADMIN_BFF_PROXY_TARGET: http://api:4000
